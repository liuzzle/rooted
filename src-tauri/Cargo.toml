[package]
name = "rooted"
version = "0.1.0"
description = "Rooted — a local-first Bible study app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rooted_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
regex = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }


# Search and verse suggestions compare a query against every verse vector of a
# translation (~31k × 1024 floats). Unoptimised, that took 4 s for one note in
# `tauri dev`; at opt-level 1 it takes 0.3 s, about what a release build does,
# and an incremental rebuild still takes ~2 s. Only this crate is affected.
[profile.dev.package.rooted]
opt-level = 1
